# Host-wide thresholds for claude-code/bin/heavy-gate (policy: modules/execution-substrates.md "Headroom gate").
# One file for every session and project on the host. Change it here, not per process.
min_mem_free_pct = 30      # memory_pressure "free percentage"
max_load_per_core = 0.67   # 1-minute load / cores (about 10 on a 15-core host)
min_disk_free_pct = 10     # free space on the home volume
slots = 1                  # concurrent heavy local runs on the host
